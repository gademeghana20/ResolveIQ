<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ResolveIQ</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2b7a62">
  <!-- The ?v=2 makes browsers fetch the new icons instead of showing the old Angular one they remembered. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" sizes="32x32 48x48" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Apply the saved Light / Dark choice before the app starts, so a dark-mode user never sees a white flash.
    // ("System" is saved as nothing, which leaves the page following the computer's own setting.)
    try {
      var saved = localStorage.getItem('resolveiq.theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
