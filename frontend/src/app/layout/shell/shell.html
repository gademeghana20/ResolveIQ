<mat-toolbar class="top-bar">
  <span class="brand">ResolveIQ</span>

  <nav class="links" aria-label="Main">
    <a mat-button routerLink="/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">Dashboard</a>
    <a mat-button routerLink="/incidents" routerLinkActive="active" ariaCurrentWhenActive="page">Incidents</a>
  </nav>

  <span class="spacer"></span>
  <span class="who">{{ auth.email() }} · {{ auth.roles().join(', ') }}</span>
  <button mat-button type="button" (click)="signOut()">Sign out</button>
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>
