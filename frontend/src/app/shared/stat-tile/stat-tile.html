<ng-template #content>
  <span class="label">{{ label() }}</span>
  <span class="value" [class.hero]="hero()">{{ value() }}</span>
  @if (note(); as text) {
    <span class="note">{{ text }}</span>
  }
</ng-template>

@if (link(); as target) {
  <a class="tile clickable" [routerLink]="target" [queryParams]="queryParams()">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <div class="tile">
    <ng-container *ngTemplateOutlet="content" />
  </div>
}
