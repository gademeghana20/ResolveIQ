<div class="page-title">
  <h1>Users</h1>
  <button mat-flat-button type="button" (click)="createUser()">New user</button>
</div>

@switch (state()) {
  @case ('loading') {
    <mat-progress-bar mode="indeterminate" aria-label="Loading users" />
  }

  @case ('failed') {
    <p class="message error" role="alert">
      The users could not be loaded.
      <button mat-button type="button" (click)="load()">Try again</button>
    </p>
  }

  @case ('ready') {
    <mat-form-field appearance="outline" class="search">
      <mat-label>Search by email</mat-label>
      <input matInput type="search" [formControl]="search" autocomplete="off" />
    </mat-form-field>

    <app-data-grid
      ariaLabel="Users"
      [rows]="visible()"
      [columns]="columnDefs"
      [rowId]="rowId"
      [emptyText]="visible().length === 0 ? (search.value ? 'No one matches &quot;' + search.value + '&quot;.' : 'There are no users yet.') : null"
    />
  }
}
