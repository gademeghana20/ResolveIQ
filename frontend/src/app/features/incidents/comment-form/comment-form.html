<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-form-field appearance="outline">
    <mat-label>Add a comment</mat-label>
    <textarea matInput rows="3" formControlName="text"></textarea>
    <mat-hint align="end">{{ text.value.length }} / {{ maxLength }}</mat-hint>
    @if (text.hasError('required')) {
      <mat-error>Write something before posting.</mat-error>
    } @else if (text.hasError('maxlength')) {
      <mat-error>That is too long: the limit is {{ maxLength }} characters.</mat-error>
    }
  </mat-form-field>

  <app-attachment-picker kind="comment" [(files)]="pendingFiles" [disabled]="submitting()" />

  @if (errorMessage(); as message) {
    <p class="form-error" role="alert">{{ message }}</p>
  }

  <button mat-flat-button type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Posting…' : 'Post comment' }}
  </button>
</form>
