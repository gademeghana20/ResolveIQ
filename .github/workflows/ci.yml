name: CI

# On every push to main and every pull request: builds both halves of the app, runs every test, checks the code
# style, scans the packages for known security problems, and drives the real app in a browser.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The tests make a throwaway database for themselves, so they need a real SQL Server to talk to.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci#Test-Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Test-Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      RESOLVEIQ_TEST_SQL_SERVER: "Server=localhost,1433;User Id=sa;Password=Ci#Test-Passw0rd"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ResolveIQ.slnx

      - name: Build
        run: dotnet build backend/ResolveIQ.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ResolveIQ.slnx --no-build --configuration Release

      # Fails the build if any package (including the ones our packages bring along) has a known security problem.
      - name: Scan packages for known vulnerabilities
        run: |
          dotnet list backend/ResolveIQ.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerabilities.txt
          if grep -q "has the following vulnerable packages" vulnerabilities.txt; then
            echo "::error::A package has a known vulnerability. See the list above."
            exit 1
          fi

  frontend:
    name: Frontend (tests and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact packages in package-lock.json
        run: npm ci

      - name: Check the code style
        run: npx ng lint

      # Only the packages that ship to people's browsers; build tools are not part of what visitors run.
      - name: Scan packages for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npx ng test --no-watch

      - name: Build for production
        run: npx ng build

  e2e:
    name: Browser tests (real app, real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci#Test-Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Test-Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # The tests build and use their own throwaway database, called ResolveIQ_E2E.
      E2E_CONNECTION: "Server=localhost,1433;Database=ResolveIQ_E2E;User Id=sa;Password=Ci#Test-Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install the tool that builds the database
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Install the web app's packages
        run: npm ci
        working-directory: frontend

      - name: Install the browser tests' packages
        run: npm ci
        working-directory: e2e

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run the browser tests
        run: npx playwright test
        working-directory: e2e

      - name: Keep the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
