name: CI

# Runs every test, and builds both halves of the app, on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The tests make a throwaway database for themselves, so they need a real SQL Server to talk to.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci#Test-Passw0rd"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci#Test-Passw0rd' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      RESOLVEIQ_TEST_SQL_SERVER: "Server=localhost,1433;User Id=sa;Password=Ci#Test-Passw0rd"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/ResolveIQ.slnx

      - name: Build
        run: dotnet build backend/ResolveIQ.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/ResolveIQ.slnx --no-build --configuration Release

  frontend:
    name: Frontend (tests and build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the exact packages in package-lock.json
        run: npm ci

      - name: Test
        run: npx ng test --no-watch

      - name: Build for production
        run: npx ng build
